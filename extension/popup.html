<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Matrix Filler</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; width: 340px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #status { font-size: 12px; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; background: #eee; }
    #status.detected { background: #d4edda; color: #155724; }
    #status.undetected { background: #f8d7da; color: #721c24; }
    textarea { width: 100%; height: 140px; font-family: ui-monospace, monospace; font-size: 11px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 8px; font-size: 13px; cursor: pointer; }
    #result { font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Lennar CVRMLS Matrix Filler (POC)</h1>
  <div id="status">Checking tab…</div>
  <textarea id="payload" placeholder="Paste JSON payload here"></textarea>
  <button id="fillBtn">Fill This Tab</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
